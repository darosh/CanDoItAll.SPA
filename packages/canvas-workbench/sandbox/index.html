<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>canvas-workbench sandbox</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      #toolbar {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 1;
        display: flex;
        gap: 8px;
      }
      #toolbar button,
      #toolbar a {
        padding: 6px 10px;
        align-self: center;
      }
      #host {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <a href="?fixture=basic">Basic</a>
      <a href="?fixture=process">Process</a>
      <a href="?fixture=workflow">Workflow</a>
      <button id="fit-view">Fit view</button>
      <button id="zoom-100">100%</button>
      <button id="select-check">Select "check"</button>
      <button id="quick-create">Quick create</button>
      <button id="toggle-diagnostics">Diagnostics</button>
      <button id="toggle-minimap">Minimap</button>
    </div>
    <p
      style="
        position: fixed;
        bottom: 8px;
        left: 8px;
        z-index: 1;
        font: 12px monospace;
        color: #71717a;
      "
    >
      Right-click a node for its context menu, or the canvas background for group actions. Alt+drag
      the background for marquee selection.
    </p>
    <div id="host"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
