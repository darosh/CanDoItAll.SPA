packages:
  - packages/*

catalogMode: prefer

catalog:
  "@lucide/vue": ^1.40.0
  "@types/node": ^24
  "@vueuse/core": ^14.4.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  reka-ui: ^2.10.4
  tailwind-merge: ^3.6.0
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  canvas: true
  vue-demi: true
